# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# GENERATED by breachsafe-repo (VERBATIM — NOT Jinja-rendered, so ${{ }} is safe).
#
# OpenSSF Scorecard weekly security-posture assessment.
#
# Scorecard scans the repo for supply-chain best practices (branch protection,
# pinned dependencies, SAST, fuzzing, signed releases, ...) and publishes a
# score. Results feed the OpenSSF Best Practices badge. publish_results:true
# uploads the aggregate to api.securityscorecards.dev (public repos only).
#
# Reference: https://github.com/ossf/scorecard-action
name: OpenSSF Scorecard

on:
  # Re-run whenever branch-protection settings change so the posture score
  # reflects the current ruleset immediately, not at the next weekly window.
  branch_protection_rule:
  schedule:
    # Mondays 06:00 UTC. Weekly cadence; not on every PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the SARIF to the code-scanning tab
      id-token: write         # publish_results OIDC attestation
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to https://api.securityscorecards.dev so the README badge
          # stays current. Requires the repo to be public.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 90

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
